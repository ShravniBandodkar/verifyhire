# Render Blueprint — one Docker web service serving the API, the agents and the web client.
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: verifyhire
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: BADGE_SIGNING_KEY
        generateValue: true
      - key: VAULT_KEKS            # master key-encryption-key for the document vault
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      # Demo default: SQLite on the instance disk. Free instances sleep after ~15 min idle and wake
      # with a clean, freshly seeded demo — every presentation starts from a known state.
      - key: DATABASE_URL
        value: sqlite:////app/backend/verifyhire.db
      # Optional LLM (agents fall back to deterministic rule engines without one)
      - key: LLM_PROVIDER
        value: none          # anthropic | openai | gemini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# Production profile (uncomment): managed PostgreSQL + pgvector instead of SQLite. Pair it with
# S3/GCS document storage or a persistent disk so vault files survive restarts.
# databases:
#   - name: verifyhire-db
#     plan: free
# …and on the web service:  - key: DATABASE_URL  fromDatabase: { name: verifyhire-db, property: connectionString }
